---
type: specs.openrewrite.org/v1beta/recipe
name: org.jboss.weld.junit.MigrateToWeldJunitJupiter
displayName: Migrate from weld-junit5 to weld-junit-jupiter
description: >-
  Migrates usages of `weld-junit5` to `weld-junit-jupiter`.
  This includes changing the Maven artifact ID and renaming the
  `org.jboss.weld.junit5` package to `org.jboss.weld.junit.jupiter`.
recipeList:
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.jboss.weld
      oldArtifactId: weld-junit5
      newGroupId: org.jboss.weld
      newArtifactId: weld-junit-jupiter
      newVersion: ${project.version}
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.jboss.weld.junit5
      newPackageName: org.jboss.weld.junit.jupiter
      recursive: true
  - org.openrewrite.RenameFile:
      fileMatcher: '**/META-INF/services/org.jboss.weld.junit5.WeldJunitEnricher'
      fileName: org.jboss.weld.junit.jupiter.WeldJunitEnricher
